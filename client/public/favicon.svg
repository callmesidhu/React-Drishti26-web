<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B78000" />
      <stop offset="35%" stop-color="#FFEA9F" />
      <stop offset="65%" stop-color="#A27200" />
      <stop offset="85%" stop-color="#E19D00" />
      <stop offset="100%" stop-color="#FFE082" />
    </linearGradient>
    <linearGradient id="goldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD779" />
      <stop offset="50%" stop-color="#B78000" />
      <stop offset="100%" stop-color="#6B4E00" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded App Container -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="rgba(225, 157, 0, 0.4)" stroke-width="2" />

  <!-- Drishti Geometric Angular "D" Wings Icon -->
  <g transform="translate(18, 18)" filter="url(#goldGlow)">
    <!-- Top Slanted Wing -->
    <polygon points="0,12 56,12 88,38 32,38" fill="url(#goldGrad1)" />
    <!-- Middle Core Wing -->
    <polygon points="12,38 68,38 92,62 36,62" fill="url(#goldGrad2)" opacity="0.95" />
    <!-- Bottom Wing -->
    <polygon points="24,62 80,62 52,86 0,86" fill="url(#goldGrad1)" />
    <!-- Vertical Spine / Diamond Accents -->
    <polygon points="0,12 18,0 28,12 10,24" fill="#FFF0B8" opacity="0.9" />
    <polygon points="76,74 92,62 82,86 66,86" fill="#FFE082" opacity="0.8" />
  </g>
</svg>