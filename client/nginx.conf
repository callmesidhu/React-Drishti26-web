server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;

    index index.html;

    # React / Vite
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static files
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}