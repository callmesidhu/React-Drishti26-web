services:
  backend:
    build: ./server
    restart: unless-stopped
    volumes:
      - sqlite_data:/app/data
    environment:
      - DATABASE_PATH=/app/data/database.db

  frontend:
    build: ./client
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  sqlite_data: