
services:

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: drishti-client
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: drishti-server
    restart: unless-stopped

    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: drishti-nginx
    restart: unless-stopped

    ports:
      - "3025:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - client
      - server