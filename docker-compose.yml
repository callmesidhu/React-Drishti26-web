
services:

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: drishti-client
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: drishti-server
    restart: unless-stopped

    env_file:
      - .env

    expose:
      - "8000"

    volumes:
      - django_data:/app/data
      - django_static:/app/staticfiles
      - django_media:/app/media

    environment:
      DATABASE_PATH: /app/data/db.sqlite3

  nginx:
    image: nginx:alpine
    container_name: drishti-nginx
    restart: unless-stopped

    ports:
      - "3025:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - django_static:/app/staticfiles:ro
      - django_media:/app/media:ro

    depends_on:
      - client
      - server

volumes:
  django_data:
  django_static:
  django_media:
