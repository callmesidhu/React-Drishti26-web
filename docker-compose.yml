
services:

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: drishti-client
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: drishti-server
    restart: unless-stopped

    env_file:
      - .env

    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn server.wsgi:application --bind 0.0.0.0:8000 --workers 3"

    expose:
      - "8000"

    volumes:
      - django_static:/app/staticfiles
      - django_media:/app/media

  nginx:
    image: nginx:alpine
    container_name: drishti-nginx
    restart: unless-stopped

    ports:
      - "3025:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - django_static:/app/staticfiles:ro
      - django_media:/app/media:ro

    depends_on:
      - client
      - server

volumes:
  django_static:
  django_media:
