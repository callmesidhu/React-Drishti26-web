name: Deploy Drishti Website

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies & Build React
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Deploy built files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "client/dist/*"
          target: "~/Drishti26/client/dist"
          strip_components: 2

      - name: Fix Server Permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Automatically grant Apache traverse & read permissions
            chmod o+x /home/clubs || true
            chmod o+x /home/clubs/drishti || true
            chmod o+x /home/clubs/drishti/Drishti26 || true
            chmod -R o+rx /home/clubs/drishti/Drishti26/client || true