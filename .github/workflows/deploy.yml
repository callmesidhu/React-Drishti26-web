name: Deploy Drishti Website

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Deployment Tarball
        run: tar -czvf deploy.tar.gz --exclude='.git' --exclude='client/node_modules' --exclude='server/node_modules' .

      - name: Copy Tarball to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "deploy.tar.gz"
          target: "~/Drishti26"

      - name: Extract and Deploy via Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd ~/Drishti26
            tar -xzvf deploy.tar.gz
            rm deploy.tar.gz
            # Start the Docker containers (ensure ports in docker-compose are > 1024)
            docker-compose up -d --build